<svg width="760" height="150" viewBox="0 0 760 150" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="150" rx="14" fill="#0D1117"/>
  <rect x="1" y="1" width="758" height="148" rx="13" fill="none" stroke="#30363D"/>

  <line x1="140" y1="75" x2="230" y2="75" stroke="#30363D" stroke-width="3"/>
  <line x1="330" y1="75" x2="420" y2="75" stroke="#30363D" stroke-width="3"/>
  <line x1="520" y1="75" x2="610" y2="75" stroke="#30363D" stroke-width="3"/>

  <rect x="40" y="48" width="100" height="54" rx="10" fill="#161B22" stroke="#58A6FF"/>
  <text x="90" y="80" text-anchor="middle" fill="#C9D1D9" font-family="monospace" font-size="14">CLIENT</text>

  <rect x="230" y="48" width="100" height="54" rx="10" fill="#161B22" stroke="#2EA043"/>
  <text x="280" y="80" text-anchor="middle" fill="#C9D1D9" font-family="monospace" font-size="14">API</text>

  <rect x="420" y="48" width="100" height="54" rx="10" fill="#161B22" stroke="#58A6FF"/>
  <text x="470" y="80" text-anchor="middle" fill="#C9D1D9" font-family="monospace" font-size="14">LOGIC</text>

  <rect x="610" y="48" width="110" height="54" rx="10" fill="#161B22" stroke="#2EA043"/>
  <text x="665" y="80" text-anchor="middle" fill="#C9D1D9" font-family="monospace" font-size="14">DATABASE</text>

  <circle r="6" fill="#58A6FF">
    <animate attributeName="cx" values="140;230;330;420;520;610" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="75;75" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <circle r="5" fill="#2EA043">
    <animate attributeName="cx" values="610;520;420;330;230;140" dur="3.5s" begin="1.75s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="75;75" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <text x="380" y="130" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="12">
    request → process → data → response
  </text>
</svg>
