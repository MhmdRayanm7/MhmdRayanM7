<svg width="760" height="190" viewBox="0 0 760 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flow" x1="0" x2="1">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#2EA043"/>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#58A6FF" stroke-opacity=".03"/>
    </pattern>
  </defs>

  <rect width="760" height="190" rx="18" fill="#0D1117"/>
  <rect width="760" height="190" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="758" height="188" rx="17" fill="none" stroke="#30363D"/>

  <text x="30" y="34" fill="#8B949E" font-family="monospace" font-size="12">
    SYSTEM REQUEST PIPELINE
  </text>

  <text x="730" y="34" text-anchor="end" fill="#2EA043" font-family="monospace" font-size="11">
    ONLINE
    <animate attributeName="opacity" values=".45;1;.45" dur="1.7s" repeatCount="indefinite"/>
  </text>

  <!-- flowing dashed pipeline -->
  <path d="M115 95 H645" stroke="#30363D" stroke-width="4" fill="none"/>
  <path d="M115 95 H645" stroke="url(#flow)" stroke-width="3" fill="none"
        stroke-dasharray="14 12" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="52;0" dur="1.6s" repeatCount="indefinite"/>
  </path>

  <!-- nodes -->
  <g font-family="monospace">
    <rect x="35" y="67" width="105" height="56" rx="12" fill="#161B22" stroke="#58A6FF"/>
    <text x="87.5" y="91" text-anchor="middle" fill="#F0F6FC" font-size="13">CLIENT</text>
    <text x="87.5" y="108" text-anchor="middle" fill="#8B949E" font-size="10">request</text>

    <rect x="220" y="67" width="105" height="56" rx="12" fill="#161B22" stroke="#2EA043"/>
    <text x="272.5" y="91" text-anchor="middle" fill="#F0F6FC" font-size="13">API</text>
    <text x="272.5" y="108" text-anchor="middle" fill="#8B949E" font-size="10">validate</text>

    <rect x="405" y="67" width="105" height="56" rx="12" fill="#161B22" stroke="#58A6FF"/>
    <text x="457.5" y="91" text-anchor="middle" fill="#F0F6FC" font-size="13">LOGIC</text>
    <text x="457.5" y="108" text-anchor="middle" fill="#8B949E" font-size="10">process</text>

    <rect x="590" y="67" width="135" height="56" rx="12" fill="#161B22" stroke="#2EA043"/>
    <text x="657.5" y="91" text-anchor="middle" fill="#F0F6FC" font-size="13">DATA</text>
    <text x="657.5" y="108" text-anchor="middle" fill="#8B949E" font-size="10">persist / query</text>
  </g>

  <!-- stage pulses -->
  <rect x="35" y="128" width="105" height="2" fill="#58A6FF" opacity=".15">
    <animate attributeName="opacity" values=".15;1;.15" dur="3.2s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <rect x="220" y="128" width="105" height="2" fill="#2EA043" opacity=".15">
    <animate attributeName="opacity" values=".15;1;.15" dur="3.2s" begin=".8s" repeatCount="indefinite"/>
  </rect>
  <rect x="405" y="128" width="105" height="2" fill="#58A6FF" opacity=".15">
    <animate attributeName="opacity" values=".15;1;.15" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="590" y="128" width="135" height="2" fill="#2EA043" opacity=".15">
    <animate attributeName="opacity" values=".15;1;.15" dur="3.2s" begin="2.4s" repeatCount="indefinite"/>
  </rect>

  <text x="380" y="161" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="11">
    DESIGN → VALIDATE → PROCESS → PERSIST → RESPOND
  </text>
</svg>
