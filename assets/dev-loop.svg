<svg width="720" height="96" viewBox="0 0 720 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#2EA043"/>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="96" rx="16" fill="#0D1117"/>
  <rect x="1" y="1" width="718" height="94" rx="15" fill="none" stroke="#30363D"/>

  <text x="28" y="28" fill="#8B949E" font-family="monospace" font-size="11">
    DEVELOPMENT LOOP
  </text>

  <!-- base line -->
  <line x1="70" y1="57" x2="650" y2="57" stroke="#21262D" stroke-width="2"/>

  <!-- active line draws itself -->
  <line x1="70" y1="57" x2="650" y2="57" stroke="url(#accent)" stroke-width="3"
        stroke-dasharray="580" stroke-dashoffset="580" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="580;0;0" keyTimes="0;.72;1" dur="5.5s" repeatCount="indefinite"/>
  </line>

  <g font-family="monospace" font-size="11" text-anchor="middle">
    <circle cx="90" cy="57" r="9" fill="#161B22" stroke="#58A6FF"/>
    <text x="90" y="82" fill="#C9D1D9">BUILD</text>

    <circle cx="225" cy="57" r="9" fill="#161B22" stroke="#2EA043"/>
    <text x="225" y="82" fill="#C9D1D9">LEARN</text>

    <circle cx="360" cy="57" r="9" fill="#161B22" stroke="#58A6FF"/>
    <text x="360" y="82" fill="#C9D1D9">DEBUG</text>

    <circle cx="495" cy="57" r="9" fill="#161B22" stroke="#2EA043"/>
    <text x="495" y="82" fill="#C9D1D9">IMPROVE</text>

    <circle cx="630" cy="57" r="9" fill="#161B22" stroke="#58A6FF"/>
    <text x="630" y="82" fill="#C9D1D9">REPEAT</text>
  </g>

  <!-- subtle node pulse, no moving dot -->
  <g fill="none" stroke-width="1.5">
    <circle cx="90" cy="57" r="14" stroke="#58A6FF" opacity="0">
      <animate attributeName="r" values="9;17" dur="2.4s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".55;0" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="225" cy="57" r="14" stroke="#2EA043" opacity="0">
      <animate attributeName="r" values="9;17" dur="2.4s" begin=".45s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".55;0" dur="2.4s" begin=".45s" repeatCount="indefinite"/>
    </circle>
    <circle cx="360" cy="57" r="14" stroke="#58A6FF" opacity="0">
      <animate attributeName="r" values="9;17" dur="2.4s" begin=".9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".55;0" dur="2.4s" begin=".9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="495" cy="57" r="14" stroke="#2EA043" opacity="0">
      <animate attributeName="r" values="9;17" dur="2.4s" begin="1.35s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".55;0" dur="2.4s" begin="1.35s" repeatCount="indefinite"/>
    </circle>
    <circle cx="630" cy="57" r="14" stroke="#58A6FF" opacity="0">
      <animate attributeName="r" values="9;17" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".55;0" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
