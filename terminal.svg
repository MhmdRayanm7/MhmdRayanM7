<svg width="820" height="230" viewBox="0 0 820 230" xmlns="http://www.w3.org/2000/svg">
  <rect width="820" height="230" rx="14" fill="#0D1117"/>
  <rect x="1" y="1" width="818" height="228" rx="13" fill="none" stroke="#30363D"/>

  <circle cx="26" cy="23" r="6" fill="#FF5F56"/>
  <circle cx="46" cy="23" r="6" fill="#FFBD2E"/>
  <circle cx="66" cy="23" r="6" fill="#27C93F"/>

  <text x="410" y="28" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="12">
    mohammed@backend
  </text>

  <text x="28" y="70" fill="#2EA043" font-family="monospace" font-size="16">$</text>

  <text x="48" y="70" fill="#C9D1D9" font-family="monospace" font-size="16">
    whoami
    <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0s" fill="freeze"/>
  </text>

  <text x="28" y="103" fill="#58A6FF" font-family="monospace" font-size="15" opacity="0">
